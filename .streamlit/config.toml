# Public-site Streamlit configuration (copied into the public build by build_public.py).
[server]
headless = true
enableStaticServing = false
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 1
runOnSave = false
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "none"
showErrorLinks = false
toolbarMode = "minimal"

[global]
developmentMode = false

[theme]
base = "light"
primaryColor = "#0a6ed1"
backgroundColor = "#f5f6f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#1d2d3e"
font = "sans serif"
